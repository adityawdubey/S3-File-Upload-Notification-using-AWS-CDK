name: CDK Deploy (main Branch)

on:
  push:
    branches: ["main"]

permissions:
  contents: read          # for actions/checkout
  id-token: write         # REQUIRED — lets the runner request the OIDC JWT

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-s3-upload-notification-${{ github.run_id }}
          aws-region: us-east-2

      - name: Export environment variables
        run: |
          echo "EMAIL_SUBSCRIPTION_ENDPOINT=${{ vars.EMAIL_SUBSCRIPTION_ENDPOINT }}" >> $GITHUB_ENV
          echo "FILE_UPLOAD_BUCKET=${{ vars.FILE_UPLOAD_BUCKET }}" >> $GITHUB_ENV

      - name: Install CDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: Bootstrap CDK environment
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          cdk bootstrap "aws://${ACCOUNT_ID}/us-east-2"

      - name: Deploy CDK stack
        run: cdk deploy --all --require-approval never
